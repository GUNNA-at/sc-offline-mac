-- pretty: quality where the graphics chip pays for it (it is nearly idle on this Mac), lean where memory and the main
-- thread pay (draw distance, model detail). Group levels: 1 Low, 2 Medium, 3 High, 4 Very High.
sys_spec_Shading = 3
sys_spec_PostProcessing = 3
sys_spec_ShadowScreenSpace = 3
sys_spec_TextureFiltering = 3
sys_spec_TextureDetail = 3
sys_spec_PlanetVolumetricClouds = 3
sys_spec_GasCloud = 3
sys_spec_Fog = 3
sys_spec_WaterCaustics = 3
sys_spec_WaterSim = 3
sys_spec_VideoComms = 3
sys_spec_Particles = 2
sys_spec_ShadowMaps = 2
sys_spec_ObjectDetail = 1
sys_spec_ObjectViewDistance = 1
sys_spec_TextureQuality = 1
-- single values, applied after the groups above ("Low:" = what the Low group sets)
r_TexturesStreamingPoolSize = 1800
-- ^ memory for streamed textures in MB. Low: 1400, Medium: 2300, High: 3300
r_TexturesStreamingMipBias = 0
-- ^ 0 = full-resolution textures up close. Low: 1 (half resolution)
e_ViewDistRatio = 55
-- ^ how far objects are drawn. Low: 75
e_ViewDistRatioLights = 35
-- ^ how far lights are drawn. Low: 50
e_LodRatio = 4
-- ^ how soon simpler models replace detailed ones. Low: 5
